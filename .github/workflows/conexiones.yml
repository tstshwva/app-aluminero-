name: Conexiones y recuperación remotas
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conexiones:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependencias sin scripts del proyecto
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Simular desconexión, reconexión, plazos y permisos
        run: npm test
      - name: Catálogo y compra con presupuesto de memoria JavaScript limitado
        run: node --max-old-space-size=128 --test tests/javascript/business-ui.test.js tests/javascript/catalog-page.test.js
      - name: Comprobar Firebase y actualizaciones reales desde GitHub
        env:
          ALUFORMIX_CLIENTE_API_KEY: ${{ secrets.ALUFORMIX_CLIENTE_API_KEY }}
          ALUFORMIX_EMPRESA_API_KEY: ${{ secrets.ALUFORMIX_EMPRESA_API_KEY }}
        run: node scripts/probar-conexion-remota.mjs
      - name: Seleccionar Java 21 del runner
        run: |
          test -n "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Probar roles, pedidos e inventario en Firestore aislado remoto
        run: npx --yes firebase-tools@15.36.0 emulators:exec --only firestore --project demo-aluformix --non-interactive 'node --test tests/firebase/empresa.test.mjs'
